<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat UI</title>

<style>
body {
    margin: 0;
    background: #ffffff;
    height: 100vh;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    height: 100vh;
    background: #5a5a5a;
    display: flex;
}

/* KREISAIS PANELIS */
.sidebar {
    width: 260px;
    min-width: 80px;
    max-width: 260px;
    background: linear-gradient(#2e2e2e, #1f1f1f);
    padding: 15px;
    box-sizing: border-box;
    color: #ccc;
    transition: width 0.3s;
    overflow: hidden;
}

.sidebar.small {
    width: 80px;
}

.top-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 12px;
    background: #777;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #999;
}

.new-chat-btn {
    flex: 1;
}

.toggle-btn {
    width: 40px;
}

.history-box {
    background: #555;
    height: calc(100% - 60px);
    border-radius: 10px;
    padding: 10px;
    box-sizing: border-box;
    overflow-y: auto;
}

.chat-item {
    background: #444;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    color: white;
    font-size: 14px;
}

.chat-item:hover {
    background: #666;
}

.chat-item.active {
    background: #888;
}

.sidebar.small .new-chat-btn,
.sidebar.small .history-box {
    display: none;
}

/* ČATS */
.chat-area {
    flex: 1;
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
}

.row {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
}

.user-row {
    align-items: flex-end;
}

.avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #2b2b2b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-bottom: 8px;
}

.hidden-avatar {
    visibility: hidden;
    height: 0;
    margin: 0;
}

.message {
    max-width: 600px;
    padding: 20px 30px;
    border-radius: 40px;
    background: #6b6b6b;
    color: white;
}

.input-bar {
    height: 70px;
    background: #2f2f2f;
    border-radius: 15px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    box-sizing: border-box;
}

.menu {
    width: 40px;
    height: 40px;
    background: #4a4a4a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-right: 15px;
}

.menu div {
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    margin: 2px 0;
}

#textInput {
    flex: 1;
    height: 40px;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="app">

    <div class="sidebar" id="sidebar">
        <div class="top-buttons">
            <button class="new-chat-btn" onclick="newChat()">+ New</button>
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
        </div>

        <div class="history-box" id="historyBox"></div>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages"></div>

        <div class="input-bar">
            <div class="menu">
                <div></div>
                <div></div>
                <div></div>
            </div>

            <input id="textInput" type="text" placeholder="Type here">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats")) || [];
let currentChatId = null;
let lastSender = null;

function saveChats() {
    localStorage.setItem("chats", JSON.stringify(chats));
}

function newChat() {

    let chat = {
        id: Date.now(),
        title: "Jauna sarakste",
        messages: [
            {
                text: "Sveiki. Kā varu palīdzēt?",
                sender: "bot"
            }
        ]
    };

    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderHistory();
    renderMessages();
}

function getCurrentChat() {
    return chats.find(chat => chat.id === currentChatId);
}

function renderHistory() {

    let historyBox = document.getElementById("historyBox");

    historyBox.innerHTML = "";

    chats.forEach(chat => {

        let item = document.createElement("div");

        item.className = "chat-item";

        if (chat.id === currentChatId) {
            item.classList.add("active");
        }

        item.textContent = chat.title;

        item.onclick = function () {

            currentChatId = chat.id;

            renderHistory();
            renderMessages();
        };

        historyBox.appendChild(item);
    });
}

function renderMessages() {

    let messagesBox = document.getElementById("messages");

    messagesBox.innerHTML = "";

    lastSender = null;

    let chat = getCurrentChat();

    if (!chat) return;

    chat.messages.forEach(msg => {
        addMessageToScreen(msg.text, msg.sender, false);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
}

function addMessageToScreen(text, sender, shouldSave = true) {

    let messages = document.getElementById("messages");

    let row = document.createElement("div");

    row.className = "row " + (sender === "user" ? "user-row" : "");

    let showAvatar = sender !== lastSender;

    row.innerHTML = `
        <div class="avatar ${showAvatar ? "" : "hidden-avatar"}">
            ${sender === "user" ? "ME" : "BOT"}
        </div>

        <div class="message">${text}</div>
    `;

    messages.appendChild(row);

    messages.scrollTop = messages.scrollHeight;

    lastSender = sender;

    if (shouldSave) {

        let chat = getCurrentChat();

        chat.messages.push({
            text: text,
            sender: sender
        });

        if (chat.title === "Jauna sarakste" && sender === "user") {
            chat.title = text.slice(0, 20);
        }

        saveChats();

        renderHistory();
    }
}

async function sendMessage() {

    let input = document.getElementById("textInput");

    let text = input.value.trim();

    if (text === "") return;

    if (currentChatId === null) {
        newChat();
    }

    addMessageToScreen(text, "user");

    input.value = "";

    try {

        const response = await fetch("/get-response", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })
        });

        const data = await response.json();

        addMessageToScreen(data.reply, "bot");

    } catch (error) {

        addMessageToScreen(
            "Kļūda savienojumā ar serveri.",
            "bot"
        );

        console.log(error);
    }
}

function toggleSidebar() {
    document
        .getElementById("sidebar")
        .classList
        .toggle("small");
}

document
    .getElementById("textInput")
    .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }
});

if (chats.length === 0) {
    newChat();
}
else {

    currentChatId = chats[0].id;

    renderHistory();
    renderMessages();
}
</script>

</body>
</html>
