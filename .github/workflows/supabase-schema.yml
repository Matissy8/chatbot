name: Apply Supabase schema

on:
  push:
    branches:
      - main
    paths:
      - "ai-tutor-lv/supabase/schema.sql"
      - "ai-tutor-lv/supabase/schema_chat_xp.sql"
      - "ai-tutor-lv/supabase/schema_practice.sql"
      - "ai-tutor-lv/supabase/schema_plans.sql"
      - "ai-tutor-lv/supabase/schema_learning_features.sql"
      - "ai-tutor-lv/supabase/schema_leaderboard.sql"
      - ".github/workflows/supabase-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL client
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply idempotent database schema
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction --file=ai-tutor-lv/supabase/schema.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction --file=ai-tutor-lv/supabase/schema_chat_xp.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction --file=ai-tutor-lv/supabase/schema_practice.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction --file=ai-tutor-lv/supabase/schema_plans.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction --file=ai-tutor-lv/supabase/schema_learning_features.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction --file=ai-tutor-lv/supabase/schema_leaderboard.sql

      - name: Explain missing database secret
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "::warning title=Supabase schema not applied::Add SUPABASE_DB_URL under repository Settings > Secrets and variables > Actions, then rerun this workflow. The database schema was not changed."
